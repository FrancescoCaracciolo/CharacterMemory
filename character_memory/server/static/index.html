<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Memory Browser</title>
  <link rel="stylesheet" href="/gui/static/styles.css">
  <!-- The knowledge-graph view is a self-contained canvas force-renderer (no CDN). -->
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="logo">◆</span> Character Memory</div>
      <div class="topbar-actions">
        <label class="char-picker">
          <span>Character</span>
          <select id="character" title="Switch character"></select>
        </label>
        <button id="refresh" class="btn icon-btn" title="Reload overview" aria-label="Reload overview">↻</button>
        <a class="btn ghost" href="/" title="JSON index">{ }</a>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="side-head">
          <input id="memory-filter" class="filter-input" placeholder="Filter memories…" autocomplete="off">
        </div>
        <nav id="memories" class="mem-list" aria-label="Memories"></nav>
      </aside>

      <section class="content">
        <div class="content-head">
          <div class="ch-title">
            <h2 id="mem-title">—</h2>
            <span id="mem-kind" class="chip kind-chip"></span>
            <span id="mem-count" class="count"></span>
            <span id="mem-disabled" class="chip warn-chip hidden">disabled</span>
          </div>
          <div class="tools">
            <div class="search">
              <span class="search-ico">⌕</span>
              <input id="q" placeholder="Search this memory…" autocomplete="off" spellcheck="false">
              <button id="q-clear" class="q-clear hidden" title="Clear search" aria-label="Clear search">×</button>
            </div>
            <select id="user-filter" class="user-filter" title="Filter by user"></select>
          </div>
        </div>

        <div id="extra" class="extra"></div>
        <div id="graph-view" class="graph-view hidden">
          <div class="graph-controls">
            <div class="search">
              <span class="search-ico">⌕</span>
              <input id="graph-q" placeholder="Activate the graph by query…" autocomplete="off" spellcheck="false">
              <button id="graph-q-clear" class="q-clear hidden" title="Clear" aria-label="Clear activation query">×</button>
            </div>
            <select id="graph-user" class="user-filter" title="Bias a user's PersonNode"></select>
            <button id="graph-full" class="btn ghost" title="Show the whole graph and highlight retrieved nodes">◯ full graph</button>
            <span id="graph-meta" class="graph-meta"></span>
            <div class="graph-ctl-spacer"></div>
            <button id="graph-freeze" class="btn ghost" title="Pause / resume physics (space)">❚❚ freeze</button>
            <button id="graph-fit" class="btn ghost" title="Fit graph to view">⤢ fit</button>
            <button id="graph-repel" class="btn ghost" title="Re-run layout">↻ relayout</button>
            <button id="graph-settings-btn" class="btn ghost" title="Graph settings">⚙ settings</button>
          </div>
          <div class="graph-split">
            <div class="graph-canvas-wrap">
              <canvas id="cy" class="graph-cy"></canvas>
              <div id="graph-overlay" class="graph-overlay"></div>
              <div id="graph-settings" class="graph-settings">
                <div class="gs-title">Graph settings <button id="gs-close" class="gs-close" title="Hide panel">×</button></div>
                <label class="gs-row">
                  <span class="gs-label">Repulsion</span>
                  <span class="gs-val" id="gs-repulsion-val">3200</span>
                  <input type="range" id="gs-repulsion" min="500" max="8000" step="100" value="3200">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Link distance</span>
                  <span class="gs-val" id="gs-link-val">78</span>
                  <input type="range" id="gs-link" min="30" max="220" step="2" value="78">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Gravity</span>
                  <span class="gs-val" id="gs-gravity-val">0.018</span>
                  <input type="range" id="gs-gravity" min="0" max="0.06" step="0.002" value="0.018">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Particle speed</span>
                  <span class="gs-val" id="gs-particles-val">1.0</span>
                  <input type="range" id="gs-particles" min="0" max="3" step="0.1" value="1">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Label zoom</span>
                  <span class="gs-val" id="gs-labelzoom-val">2.4</span>
                  <input type="range" id="gs-labelzoom" min="1.2" max="4" step="0.1" value="2.4">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Node limit</span>
                  <span class="gs-val" id="gs-nodes-val">50</span>
                  <input type="range" id="gs-nodes" min="10" max="6000" step="10" value="50">
                </label>
                <label class="gs-row">
                  <span class="gs-label">Edge limit</span>
                  <span class="gs-val" id="gs-edges-val">300</span>
                  <input type="range" id="gs-edges" min="50" max="10000" step="50" value="300">
                </label>
                <button id="gs-reset" class="gs-reset" title="Restore defaults">reset defaults</button>
              </div>
            </div>
            <aside id="graph-side" class="graph-side">
              <div class="graph-side-head">Top activated</div>
              <div id="graph-detail" class="graph-detail hidden"></div>
              <ol id="graph-list" class="graph-list"></ol>
            </aside>
          </div>
          <div class="graph-legend">
            <span><span class="dot dot-self"></span> self</span>
            <span><span class="dot dot-person"></span> person</span>
            <span><span class="dot dot-fact"></span> fact</span>
            <span><span class="dot dot-episode"></span> episode</span>
            <span><span class="dot dot-entity"></span> entity</span>
            <span class="graph-tip">node size &amp; opacity ∝ activation</span>
          </div>
        </div>
        <div id="records" class="records"></div>
        <div id="paginator" class="paginator"></div>
        <div id="status" class="status hidden"></div>
      </section>
    </div>
  </div>
  <script src="/gui/static/app.js"></script>
</body>
</html>
